[project]
name = "taskwarrior_flow"
version = "0.6.0"
description = "Set of helpers for improving Taskwarrior workflow"
authors = [
    {name = "Ben Trinh", email = "huantrinh1802@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.3",
    "python-dateutil>=2.8.2",
    "questionary>=2.0.1",
    "dateparser>=1.2.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40.0", "openai>=1.0.0"]

[project.scripts]
twf = "tools.main:app"

[project.urls]
Homepage = "https://github.com/huantrinh1802/taskwarrior_flow"
Issues = "https://github.com/huantrinh1802/taskwarrior_flow/issues"

[dependency-groups]
dev = [
    "ruff>=0.1.3",
    "mypy>=1.6.1",
    "types-python-dateutil>=2.8.19.14",
    "pytest>=8.2.0",
    "types-dateparser>=1.2.0.20240420",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.ruff]
line-length = 320
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "I", "TD"]
ignore = []

[tool.pytest.ini_options]
log_cli = true
log_level = "INFO"
testpaths = ["tests"]
addopts = "--capture=no"
